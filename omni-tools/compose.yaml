services:
  omni-omni-tools:
    image: iib0011/omni-tools:latest
    container_name: omni-tools
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.omni-tools.service=omni-tools_service
      - traefik.http.routers.omni-tools.rule=Host(`${OMNI_TOOLS_HOST}`)
      - traefik.http.routers.omni-tools.entrypoints=websecure
      - traefik.http.routers.omni-tools.tls.certresolver=myresolver
      - traefik.http.services.omni-tools_service.loadbalancer.server.port=80
networks:
  traefik:
    external: true