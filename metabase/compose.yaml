services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: "unless-stopped"
    depends_on:
      - mb_postgres
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: mb_postgres
    volumes:
      - /dev/urandom:/dev/random:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.metabase.service=metabase_service
      - traefik.http.routers.metabase.rule=Host(`${METABASE_HOST}`)
      - traefik.http.routers.metabase.entrypoints=websecure
      - traefik.http.routers.metabase.tls.certresolver=myresolver
      - traefik.http.services.metabase_service.loadbalancer.server.port=3000
  
  mb_postgres:
    image: postgres:16 #Must specify a version - latest tag doesn't work
    container_name: postgres
    restart: "unless-stopped"
    hostname: postgres"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - metabase_data:/var/lib/postgresql/data
    networks:
      - traefik
networks:
  traefik:
    external: true
volumes:
  metabase_data: